<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketplace BI Dashboard</title>
  <style>
    :root {
      --bg: #020817;
      --panel: rgba(5, 18, 43, 0.86);
      --panel-2: rgba(7, 25, 58, 0.78);
      --line: rgba(169, 209, 255, 0.24);
      --text: #fff4c2;
      --muted: #c7defc;
      --accent: #ffe27a;
      --accent-2: #72f7ff;
      --soft: rgba(255, 255, 255, 0.08);
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.42), 0 0 34px rgba(56, 189, 248, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(17, 85, 150, 0.28), transparent 28%),
        radial-gradient(circle at 82% 8%, rgba(8, 47, 99, 0.28), transparent 24%),
        radial-gradient(circle at 50% 110%, rgba(14, 43, 88, 0.42), transparent 34%),
        radial-gradient(circle at 12% 28%, rgba(255, 247, 199, 0.18) 0 1px, transparent 1.6px),
        radial-gradient(circle at 73% 38%, rgba(255, 247, 199, 0.14) 0 1px, transparent 1.7px),
        radial-gradient(circle at 88% 72%, rgba(114, 247, 255, 0.12) 0 1px, transparent 1.8px),
        radial-gradient(circle at 38% 78%, rgba(255, 247, 199, 0.11) 0 1px, transparent 1.8px),
        linear-gradient(135deg, #010511 0%, #031025 48%, #061a39 100%);
      background-attachment: fixed;
      background-size: auto, auto, auto, 260px 260px, 330px 330px, 420px 420px, 510px 510px, auto;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      background: rgba(2, 8, 23, 0.84);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      color: #fff7c7;
      text-shadow: 0 0 14px rgba(255, 242, 184, 0.34);
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      display: flex;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    main {
      padding: 20px 24px 28px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    aside,
    .chart-panel,
    .table-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    aside {
      padding: 16px;
      position: sticky;
      top: 84px;
      z-index: 4;
    }

    .control {
      display: grid;
      gap: 7px;
      margin-bottom: 14px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    select,
    button {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font: inherit;
      padding: 8px 10px;
    }

    option {
      color: #14082f;
      background: #fff7f0;
    }

    .date-picker {
      position: relative;
    }

    .date-dropdown-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
    }

    .date-dropdown-button::after {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-2px) rotate(45deg);
      transition: transform 140ms ease;
    }

    .date-dropdown-button[aria-expanded="true"]::after {
      transform: translateY(2px) rotate(225deg);
    }

    .date-dropdown-button:disabled {
      cursor: default;
      opacity: 0.56;
    }

    .date-dropdown-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .date-dropdown-panel {
      position: absolute;
      z-index: 30;
      top: calc(100% + 7px);
      left: 0;
      width: min(470px, calc(100vw - 48px));
      padding: 12px;
      border: 1px solid rgba(114, 247, 255, 0.34);
      border-radius: 9px;
      background: rgba(3, 12, 30, 0.98);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.52), 0 0 24px rgba(114, 247, 255, 0.14);
      backdrop-filter: blur(18px);
    }

    .date-dropdown-panel[hidden] {
      display: none;
    }

    .date-calendar-layout {
      display: grid;
      grid-template-columns: minmax(270px, 1fr) 120px;
      gap: 12px;
    }

    .calendar-main {
      min-width: 0;
    }

    .calendar-head {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
    }

    .calendar-head button {
      min-height: 32px;
      padding: 4px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      background: rgba(114, 247, 255, 0.08);
    }

    .calendar-head button:hover:not(:disabled) {
      color: #020817;
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    .calendar-head button:disabled {
      opacity: 0.28;
      cursor: default;
    }

    .calendar-title {
      color: #fff8d6;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      text-transform: capitalize;
    }

    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(30px, 1fr));
      gap: 3px;
    }

    .calendar-weekdays {
      margin-bottom: 4px;
    }

    .calendar-weekdays span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
    }

    .calendar-day,
    .calendar-blank {
      min-height: 32px;
    }

    .calendar-day {
      position: relative;
      padding: 4px;
      border-color: transparent;
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      background: transparent;
    }

    .calendar-day:hover:not(:disabled) {
      border-color: rgba(114, 247, 255, 0.42);
      background: rgba(114, 247, 255, 0.12);
    }

    .calendar-day.in-range {
      color: #e9fdff;
      background: rgba(114, 247, 255, 0.15);
    }

    .calendar-day.range-edge {
      color: #020817;
      font-weight: 900;
      background: var(--accent-2);
      border-color: var(--accent-2);
      box-shadow: 0 0 14px rgba(114, 247, 255, 0.34);
    }

    .calendar-day.has-data::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent);
      transform: translateX(-50%);
    }

    .calendar-day:disabled {
      color: rgba(199, 222, 252, 0.24);
      cursor: default;
    }

    .date-presets {
      display: grid;
      align-content: start;
      gap: 6px;
      padding-left: 11px;
      border-left: 1px solid var(--line);
    }

    .date-presets-title {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .date-presets button {
      min-height: 31px;
      padding: 5px 7px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
    }

    .date-presets button:hover,
    .date-presets button.active {
      color: #020817;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(255, 226, 122, 0.22);
    }

    .date-dropdown-summary {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 560px) {
      .date-dropdown-panel {
        width: min(360px, calc(100vw - 28px));
      }

      .date-calendar-layout {
        grid-template-columns: 1fr;
      }

      .date-presets {
        grid-template-columns: repeat(3, 1fr);
        padding-top: 10px;
        padding-left: 0;
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      .date-presets-title {
        grid-column: 1 / -1;
      }
    }

    select:focus,
    button:focus {
      outline: 2px solid rgba(37, 99, 235, 0.22);
      border-color: var(--accent-2);
    }

    .mode {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 6px;
      margin-bottom: 16px;
    }

    .mode button {
      padding: 8px 6px;
      font-size: 13px;
      cursor: pointer;
      background: var(--soft);
    }

    .mode button.active {
      background: var(--accent);
      color: #13071f;
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(248, 212, 107, 0.32);
    }

    .kpis {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }

    .kpi {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--panel-2);
    }

    .kpi-title {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: 800;
      color: #fff8d6;
      text-shadow: 0 0 10px rgba(255, 248, 214, 0.34);
    }

    .kpi-delta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      display: grid;
      gap: 18px;
      min-width: 0;
      position: relative;
    }

    .chart-wrap.adding-footnote {
      cursor: crosshair;
    }

    .chart-wrap.placing-footnote-arrow {
      cursor: crosshair;
    }

    .content.gallery-mode {
      grid-template-rows: 1fr;
    }

    .chart-panel {
      padding: 16px;
      min-height: 620px;
    }

    .content.gallery-mode .chart-panel {
      min-height: calc(100vh - 138px);
    }

    .chart-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
      align-items: flex-start;
    }

    .chart-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .chart-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      color: #fff4c2;
      text-shadow: 0 0 14px rgba(255, 242, 184, 0.24);
    }

    .chart-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .back-button {
      width: auto;
      min-height: 34px;
      padding: 7px 12px;
      cursor: pointer;
      color: #020817;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(255, 226, 122, 0.28);
    }

    .footnote-add-button {
      width: auto;
      min-height: 34px;
      padding: 7px 12px;
      cursor: pointer;
      color: #fff4c2;
      background: rgba(114, 247, 255, 0.12);
      border-color: rgba(114, 247, 255, 0.34);
      box-shadow: 0 0 16px rgba(114, 247, 255, 0.12);
    }

    .footnote-add-button.active {
      color: #020817;
      background: var(--accent-2);
      border-color: var(--accent-2);
    }

    .footnote-layer {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
    }

    .footnote-arrows {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .footnote-arrow-line {
      stroke: #ffe27a;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(255, 226, 122, 0.55));
      vector-effect: non-scaling-stroke;
    }

    .footnote-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      z-index: 2;
    }

    .footnote-dot {
      width: 25px;
      height: 25px;
      min-height: 25px;
      padding: 0;
      border-radius: 50%;
      color: #020817;
      background: var(--accent);
      border: 2px solid rgba(255, 255, 255, 0.82);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
      cursor: move;
      box-shadow: 0 0 16px rgba(255, 226, 122, 0.58), 0 8px 20px rgba(0, 0, 0, 0.35);
      user-select: none;
      touch-action: none;
    }

    .footnote-marker.pinned .footnote-dot {
      background: var(--accent-2);
      box-shadow: 0 0 18px rgba(114, 247, 255, 0.66), 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .footnote-card {
      position: absolute;
      left: 18px;
      top: 18px;
      width: min(280px, 42vw);
      padding: 10px;
      border: 1px solid rgba(255, 226, 122, 0.36);
      border-radius: 8px;
      background: rgba(3, 12, 30, 0.96);
      color: var(--text);
      font-size: 13px;
      line-height: 1.35;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.46), 0 0 22px rgba(255, 226, 122, 0.16);
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }

    .footnote-marker:hover .footnote-card,
    .footnote-marker:focus-within .footnote-card,
    .footnote-marker.pinned .footnote-card {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .footnote-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .footnote-anchor {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid rgba(169, 209, 255, 0.18);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .footnote-anchor.unavailable {
      color: #ffd7a3;
    }

    .footnote-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .footnote-tools button {
      width: 28px;
      min-height: 26px;
      padding: 4px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: inline-grid;
      place-items: center;
    }

    .footnote-tools [data-action="arrow"] {
      cursor: crosshair;
      touch-action: none;
    }

    .legend {
      display: grid;
      align-content: start;
      gap: 8px;
      min-width: 210px;
      max-height: 500px;
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07), rgba(114, 247, 255, 0.05));
    }

    .legend button {
      width: 100%;
      min-height: 28px;
      border-radius: 6px;
      padding: 4px 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-start;
      cursor: pointer;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.06);
    }

    .legend button.off {
      opacity: 0.42;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
      box-shadow: 0 0 10px currentColor;
    }

    .chart-wrap {
      position: relative;
      min-height: 500px;
      justify-self: start;
      width: min(1040px, 100%);
    }

    .chart-body {
      display: grid;
      grid-template-columns: minmax(560px, 1040px) minmax(300px, 390px);
      gap: 14px;
      align-items: start;
      justify-content: start;
    }

    .chart-sidebar {
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
    }

    .notes-panel {
      padding: 12px;
      min-width: 260px;
      min-height: 230px;
      width: 100%;
      height: 330px;
      resize: both;
      overflow: auto;
      border: 1px solid rgba(255, 226, 122, 0.24);
      border-radius: 10px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(114, 247, 255, 0.04)),
        rgba(1, 8, 22, 0.42);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 0 22px rgba(114, 247, 255, 0.08);
    }

    .notes-panel label {
      display: block;
      margin-bottom: 8px;
      color: #fff4c2;
      text-shadow: 0 0 10px rgba(255, 242, 184, 0.18);
    }

    .notes-panel textarea {
      width: 100%;
      min-width: 180px;
      min-height: 150px;
      height: calc(100% - 92px);
      resize: both;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      color: var(--text);
      background: rgba(2, 8, 23, 0.58);
      font: inherit;
      line-height: 1.4;
      outline: none;
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.18);
    }

    .notes-panel textarea:focus {
      border-color: rgba(255, 226, 122, 0.56);
      box-shadow: 0 0 18px rgba(255, 226, 122, 0.12), inset 0 0 18px rgba(0, 0, 0, 0.18);
    }

    .notes-status {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .notes-actions {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .notes-actions button {
      min-height: 34px;
      border: 1px solid rgba(255, 226, 122, 0.34);
      border-radius: 9px;
      background: rgba(255, 226, 122, 0.12);
      color: #fff4c2;
      font: 700 12px/1.2 "Segoe UI", Arial, sans-serif;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .notes-actions button:hover {
      border-color: rgba(255, 226, 122, 0.62);
      background: rgba(255, 226, 122, 0.18);
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      grid-auto-rows: 1fr;
      gap: 14px;
      min-height: calc(100vh - 270px);
    }

    .thumb-card {
      min-height: 250px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: rgba(1, 8, 22, 0.46);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      display: grid;
      grid-template-rows: auto auto minmax(170px, 1fr);
    }

    .thumb-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 226, 122, 0.62);
      box-shadow: 0 0 28px rgba(114, 247, 255, 0.16);
    }

    .thumb-title {
      margin: 0 0 4px;
      font-size: 15px;
      color: #fff4c2;
      text-shadow: 0 0 12px rgba(255, 242, 184, 0.2);
    }

    .thumb-meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .thumb-card svg {
      height: 100%;
      min-height: 170px;
      background: rgba(1, 8, 22, 0.28);
    }

    svg {
      width: 100%;
      height: 500px;
      display: block;
      overflow: visible;
      background: rgba(1, 8, 22, 0.34);
      border-radius: 8px;
    }

    .axis,
    .grid {
      stroke: var(--line);
      stroke-width: 1;
    }

    .grid {
      opacity: 0.75;
    }

    .axis-text {
      fill: #fff8d6;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 0 9px rgba(255, 248, 214, 0.42);
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      min-width: 220px;
      max-width: 360px;
      background: rgba(3, 12, 30, 0.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 10px;
      font-size: 12px;
      display: none;
      z-index: 3;
    }

    .tooltip strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #fff8d6;
    }

    .tooltip-row {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 7px;
      align-items: center;
      margin-top: 4px;
    }

    .table-panel {
      padding: 14px;
      overflow: hidden;
    }

    .table-scroll {
      overflow: auto;
      max-height: 320px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      text-align: right;
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      white-space: nowrap;
    }

    td {
      color: #fff8d6;
      font-weight: 650;
    }

    tbody tr {
      background: linear-gradient(90deg, rgba(114, 247, 255, 0.10), rgba(255, 255, 255, 0.025));
    }

    tbody tr:nth-child(even) {
      background: linear-gradient(90deg, rgba(255, 226, 122, 0.10), rgba(255, 255, 255, 0.025));
    }

    th:first-child,
    td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: rgba(5, 18, 43, 0.96);
    }

    th {
      color: #dff7ff;
      font-weight: 800;
