  <script id="dashboard-notes" type="application/json">{}</script>
  <script>
    const records = JSON.parse(document.getElementById("dashboard-data").textContent);
    const embeddedNotes = JSON.parse(document.getElementById("dashboard-notes").textContent || "{}");
    const palette = ["#20f6ff", "#ffd84d", "#ff4df2", "#65ff7a", "#9b7cff", "#ff6b54", "#22ffc8", "#ff9f1c", "#38bdf8", "#f472ff", "#c8ff3d", "#ff4f7b"];
    const notesStoragePrefix = "marketplace-dashboard-notes:";
    const footnotesStoragePrefix = "marketplace-dashboard-footnotes:";
    const embeddedNotesTokenKey = "marketplace-dashboard-embedded-notes-token";
    const embeddedNotesToken = typeof embeddedNotes.__exportId === "string" ? embeddedNotes.__exportId : "";
    const modeLabels = { "Тотал": "Тотал", "Бренд": "Бренды", "По кабинетам": "Маркетплейсы", "Месяца": "Месяцы", "Месяцы": "Месяцы" };
    const modeOrder = ["Тотал", "Бренд", "По кабинетам", "Месяца", "Месяцы"];
    const state = {
      mode: modeOrder.find(mode => records.some(record => record.tab === mode)) || records[0]?.tab,
      filter: "",
      slice: "",
      view: "gallery",
      dateStart: null,
      dateEnd: null,
      calendarMonth: null,
      selectingRangeEnd: false,
      addingFootnote: false,
      placingArrowFor: null,
      chartPoints: [],
      hidden: new Set(),
    };
    const initialParams = new URLSearchParams(window.location.search);
    if (initialParams.has("mode")) state.mode = initialParams.get("mode");
    if (initialParams.has("filter")) state.filter = initialParams.get("filter");
    if (initialParams.has("slice")) {
      state.slice = initialParams.get("slice");
      state.view = "detail";
    }

    const el = {
      modeButtons: document.getElementById("modeButtons"),
      filterSelect: document.getElementById("filterSelect"),
      sliceSelect: document.getElementById("sliceSelect"),
      datePicker: document.getElementById("datePicker"),
      dateDropdownButton: document.getElementById("dateDropdownButton"),
      dateDropdownLabel: document.getElementById("dateDropdownLabel"),
      dateDropdownPanel: document.getElementById("dateDropdownPanel"),
      calendarPrev: document.getElementById("calendarPrev"),
      calendarNext: document.getElementById("calendarNext"),
      calendarTitle: document.getElementById("calendarTitle"),
      calendarGrid: document.getElementById("calendarGrid"),
      datePresets: document.getElementById("datePresets"),
      dateDropdownSummary: document.getElementById("dateDropdownSummary"),
      allDateRange: document.getElementById("allDateRange"),
      kpis: document.getElementById("kpis"),
      title: document.getElementById("chartTitle"),
      meta: document.getElementById("chartMeta"),
      legend: document.getElementById("legend"),
      backButton: document.getElementById("backButton"),
      addFootnoteButton: document.getElementById("addFootnoteButton"),
      footnoteLayer: document.getElementById("footnoteLayer"),
      thumbnailGrid: document.getElementById("thumbnailGrid"),
      chartBody: document.getElementById("chartBody"),
      chartSidebar: document.querySelector(".chart-sidebar"),
      chart: document.getElementById("chart"),
      wrap: document.getElementById("chartWrap"),
      tooltip: document.getElementById("tooltip"),
      notesArea: document.getElementById("notesArea"),
      exportNotesHtml: document.getElementById("exportNotesHtml"),
      notesStatus: document.getElementById("notesStatus"),
      table: document.getElementById("dataTable"),
      content: document.querySelector(".content"),
      tablePanel: document.querySelector(".table-panel"),
      seriesCount: document.getElementById("seriesCount"),
      periodCount: document.getElementById("periodCount"),
    };

    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function byPreferredOrder(values, preferred) {
      return values.sort((left, right) => {
        const leftIdx = preferred.indexOf(left);
        const rightIdx = preferred.indexOf(right);
        if (leftIdx !== -1 || rightIdx !== -1) return (leftIdx === -1 ? 999 : leftIdx) - (rightIdx === -1 ? 999 : rightIdx);
        return left.localeCompare(right, "en");
      });
    }

    function currentCandidates() {
      return records.filter(record => record.tab === state.mode);
    }

    function currentRows() {
      return records.filter(record =>
        record.tab === state.mode &&
        record.filter === state.filter &&
        record.slice === state.slice &&
        !state.hidden.has(record.title)
      );
    }

    function allRowsForSelection() {
      return records.filter(record =>
        record.tab === state.mode &&
        record.filter === state.filter &&
        record.slice === state.slice
      );
    }

    function setSelectOptions(select, values, selected) {
      select.innerHTML = "";
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      if (values.includes(selected)) select.value = selected;
      else if (values.length) select.value = values[0];
      return select.value;
    }

    function closeDateDropdown() {
      el.dateDropdownPanel.hidden = true;
      el.dateDropdownButton.setAttribute("aria-expanded", "false");
    }

    function resetDateSelection() {
      state.dateStart = null;
      state.dateEnd = null;
      state.calendarMonth = null;
      state.selectingRangeEnd = false;
      closeDateDropdown();
    }

    function periodsForCurrentChart() {
      if (state.view !== "detail" || !state.slice) return [];
      return allRowsForSelection()[0]?.periods || [];
    }

    function parsePeriodDate(period) {
      const match = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(period);
      if (!match) return null;
      const day = Number(match[1]);
      const month = Number(match[2]) - 1;
      const year = Number(match[3]);
      const parsed = new Date(Date.UTC(year, month, day));
      if (parsed.getUTCFullYear() !== year || parsed.getUTCMonth() !== month || parsed.getUTCDate() !== day) return null;
      return parsed;
    }

    function dateFromIso(iso) {
      const [year, month, day] = iso.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }

    function isoFromDate(value) {
      return `${value.getUTCFullYear()}-${String(value.getUTCMonth() + 1).padStart(2, "0")}-${String(value.getUTCDate()).padStart(2, "0")}`;
    }

    function formatIsoDate(iso, includeYear = true) {
      const [year, month, day] = iso.split("-");
      return includeYear ? `${day}.${month}.${year}` : `${day}.${month}`;
    }

    function addUtcDays(value, amount) {
      const result = new Date(value.getTime());
      result.setUTCDate(result.getUTCDate() + amount);
      return result;
    }

    function periodDateEntries(periods) {
      return periods.map(period => {
        const dateValue = parsePeriodDate(period);
        return dateValue ? { period, dateValue, iso: isoFromDate(dateValue), time: dateValue.getTime() } : null;
      }).filter(Boolean);
    }

    function dateRangeForPeriods(periods) {
      const entries = periodDateEntries(periods);
      if (!periods.length || entries.length !== periods.length) return null;
      const times = entries.map(entry => entry.time);
      const min = isoFromDate(new Date(Math.min(...times)));
      const max = isoFromDate(new Date(Math.max(...times)));
      let start = state.dateStart || min;
      let end = state.dateEnd || max;
      start = start < min ? min : (start > max ? max : start);
      end = end < min ? min : (end > max ? max : end);
      if (start > end) [start, end] = [end, start];
      return { entries, min, max, start, end };
    }

    function selectedPeriods(periods) {
      const range = dateRangeForPeriods(periods);
      if (!range) return periods.slice();
      return periods.filter(period => {
        const dateValue = parsePeriodDate(period);
        if (!dateValue) return false;
        const iso = isoFromDate(dateValue);
        return iso >= range.start && iso <= range.end;
      });
    }

    function calendarMonthIso(value) {
      return `${value.getUTCFullYear()}-${String(value.getUTCMonth() + 1).padStart(2, "0")}-01`;
    }

    function renderCalendar(range) {
      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      const minMonth = `${range.min.slice(0, 7)}-01`;
      const maxMonth = `${range.max.slice(0, 7)}-01`;
      if (!state.calendarMonth || state.calendarMonth < minMonth || state.calendarMonth > maxMonth) {
        state.calendarMonth = `${range.end.slice(0, 7)}-01`;
      }
      const monthDate = dateFromIso(state.calendarMonth);
      const year = monthDate.getUTCFullYear();
      const month = monthDate.getUTCMonth();
      const firstWeekday = (new Date(Date.UTC(year, month, 1)).getUTCDay() + 6) % 7;
      const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
      const datesWithData = new Set(range.entries.map(entry => entry.iso));
      el.calendarTitle.textContent = `${monthNames[month]} ${year}`;
      el.calendarPrev.disabled = state.calendarMonth <= minMonth;
      el.calendarNext.disabled = state.calendarMonth >= maxMonth;
      el.calendarGrid.innerHTML = "";
      for (let index = 0; index < firstWeekday; index += 1) {
        const blank = document.createElement("span");
        blank.className = "calendar-blank";
        el.calendarGrid.appendChild(blank);
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const iso = isoFromDate(new Date(Date.UTC(year, month, day)));
        const button = document.createElement("button");
        button.type = "button";
        button.className = "calendar-day";
        button.textContent = String(day);
        button.disabled = iso < range.min || iso > range.max;
        button.setAttribute("aria-label", formatIsoDate(iso));
        if (iso >= range.start && iso <= range.end) button.classList.add("in-range");
        if (iso === range.start || iso === range.end) button.classList.add("range-edge");
        if (datesWithData.has(iso)) button.classList.add("has-data");
        button.addEventListener("click", () => {
          if (!state.selectingRangeEnd) {
            state.dateStart = iso;
            state.dateEnd = iso;
            state.selectingRangeEnd = true;
          } else {
            state.dateEnd = iso;
            if (state.dateEnd < state.dateStart) [state.dateStart, state.dateEnd] = [state.dateEnd, state.dateStart];
            state.selectingRangeEnd = false;
          }
          render();
        });
        el.calendarGrid.appendChild(button);
      }
    }

    function moveCalendarMonth(amount) {
      if (!state.calendarMonth) return;
      const current = dateFromIso(state.calendarMonth);
      state.calendarMonth = calendarMonthIso(new Date(Date.UTC(current.getUTCFullYear(), current.getUTCMonth() + amount, 1)));
      syncDatePicker();
    }

    function applyQuickDateRange(dayCount) {
      const periods = periodsForCurrentChart();
      const range = dateRangeForPeriods(periods);
      if (!range) return;
      const endDate = dateFromIso(range.max);
      let start = isoFromDate(addUtcDays(endDate, -(dayCount - 1)));
      if (start < range.min) start = range.min;
      state.dateStart = start;
      state.dateEnd = range.max;
      state.calendarMonth = `${range.max.slice(0, 7)}-01`;
      state.selectingRangeEnd = false;
      render();
    }

    function syncDatePicker() {
      const periods = periodsForCurrentChart();
      const range = dateRangeForPeriods(periods);
      const hasCalendarDates = Boolean(range);
      el.dateDropdownButton.disabled = !hasCalendarDates;
      if (!hasCalendarDates) {
        el.dateDropdownLabel.textContent = periods.length ? "Для графика нет календарных дат" : "Сначала выберите график";
        el.dateDropdownSummary.textContent = periods.length ? "Доступны агрегированные периоды" : "Нет доступных дат";
        el.calendarTitle.textContent = "";
        el.calendarGrid.innerHTML = "";
        closeDateDropdown();
        return;
      }
      if (state.dateStart !== null) state.dateStart = range.start;
      if (state.dateEnd !== null) state.dateEnd = range.end;
      const selected = selectedPeriods(periods);
      const isFullRange = range.start === range.min && range.end === range.max;
      el.dateDropdownLabel.textContent = isFullRange
        ? `Весь период · ${selected.length} дат`
        : `${formatIsoDate(range.start, false)} — ${formatIsoDate(range.end, false)} · ${selected.length} дат`;
      el.dateDropdownSummary.textContent = state.selectingRangeEnd
        ? `Начало: ${formatIsoDate(range.start)} · выберите дату окончания`
        : `${formatIsoDate(range.start)} — ${formatIsoDate(range.end)} · ${selected.length} дат`;
      el.datePresets.querySelectorAll("[data-days]").forEach(button => {
        const dayCount = Number(button.dataset.days);
        const expectedStart = isoFromDate(addUtcDays(dateFromIso(range.max), -(dayCount - 1)));
        button.classList.toggle("active", range.end === range.max && range.start === (expectedStart < range.min ? range.min : expectedStart));
      });
      el.allDateRange.classList.toggle("active", isFullRange);
      renderCalendar(range);
    }

    function syncControls() {
      el.modeButtons.innerHTML = "";
      byPreferredOrder(unique(records.map(record => record.tab)), modeOrder).forEach(mode => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = modeLabels[mode] || mode;
        button.className = mode === state.mode ? "active" : "";
        button.addEventListener("click", () => {
          setFootnoteAddMode(false);
          state.mode = mode;
          state.hidden.clear();
          state.filter = "";
          state.slice = "";
          state.view = "gallery";
          resetDateSelection();
          syncControls();
          render();
        });
        el.modeButtons.appendChild(button);
      });

      const filters = byPreferredOrder(unique(currentCandidates().map(record => record.filter)), ["Без фильтра", "DZEN", "Dr.Balance"]);
      state.filter = setSelectOptions(el.filterSelect, filters, state.filter);

      const slices = byPreferredOrder(
        unique(currentCandidates().filter(record => record.filter === state.filter).map(record => record.slice)),
        ["GMV, Выкупы, Маржа", "Маржинальность", "Цены", "ДРР и Соинвест", "План / Факт", "ROI", "Структура расходов по неделям"]
      );
      el.sliceSelect.innerHTML = "";
      const allOption = document.createElement("option");
      allOption.value = "";
      allOption.textContent = "Все графики";
      el.sliceSelect.appendChild(allOption);
      slices.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        el.sliceSelect.appendChild(option);
      });
      if (!slices.includes(state.slice)) {
        state.slice = "";
        state.view = "gallery";
      }
      el.sliceSelect.value = state.slice;
    }

    function formatValue(value, dimension = "number") {
      if (value === null || value === undefined || Number.isNaN(value)) return "";
      if (dimension === "percent") return `${(value * 100).toLocaleString("ru-RU", { maximumFractionDigits: 1 })}%`;
      return value.toLocaleString("ru-RU", { maximumFractionDigits: Math.abs(value) < 100 ? 2 : 0 });
    }

    function isPercentAxis(rows, axisName) {
      return rows.some(row => (axisName === "right" ? isRightAxis(row) : !isRightAxis(row)) && row.dimension === "percent");
    }

    function clampToDomain(value, domain) {
      return Math.max(domain[0], Math.min(domain[1], value));
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function compactTitle(title) {
      return title.replace(/^\d+(\.\d+)*\s*/, "");
    }

    function noteKey() {
      return `${notesStoragePrefix}${state.mode || ""}|${state.filter || ""}|${state.slice || "gallery"}`;
    }

    function footnotesKey() {
      return `${footnotesStoragePrefix}${state.mode || ""}|${state.filter || ""}|${state.slice || "gallery"}`;
    }

    function storageGet(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (error) {
        return false;
      }
      return true;
    }

    function storageLength() {
      try {
        return localStorage.length;
      } catch (error) {
        return 0;
      }
    }

    function storageKey(index) {
      try {
        return localStorage.key(index);
      } catch (error) {
        return null;
      }
    }

    function readJsonStorage(key, fallback) {
      const embedded = embeddedNotes[key];
      const shouldPreferEmbedded = embeddedNotesToken && storageGet(embeddedNotesTokenKey) !== embeddedNotesToken && embedded !== undefined;
      try {
        if (shouldPreferEmbedded) return JSON.parse(embedded);
        const stored = storageGet(key);
        if (stored !== null) return JSON.parse(stored);
        if (embedded !== undefined) return JSON.parse(embedded);
      } catch (error) {
        try {
          if (embedded !== undefined) return JSON.parse(embedded);
        } catch (embeddedError) {
          return fallback;
        }
      }
      return fallback;
    }

    function footnotesForCurrentView() {
      const notes = readJsonStorage(footnotesKey(), []);
      return Array.isArray(notes) ? notes : [];
    }

    function saveFootnotes(notes) {
      storageSet(footnotesKey(), JSON.stringify(notes));
    }

    function clampPercent(value) {
      return Math.max(0, Math.min(100, value));
    }

    function contentPointFromEvent(event) {
      const bounds = el.wrap.getBoundingClientRect();
      return {
        x: clampPercent(((event.clientX - bounds.left) / bounds.width) * 100),
        y: clampPercent(((event.clientY - bounds.top) / bounds.height) * 100),
      };
    }

    function chartAnchorFromPoint(point) {
      return {
        sheet: point.sheet,
        title: point.title,
        period: point.period,
      };
    }

    function chartPointForAnchor(anchor) {
      if (!anchor || !anchor.title || !anchor.period) return null;
      return state.chartPoints.find(point =>
        point.title === anchor.title &&
        point.period === anchor.period &&
        (!anchor.sheet || point.sheet === anchor.sheet)
      ) || null;
    }

    function chartPointClientPosition(point) {
      const matrix = el.chart.getScreenCTM();
      if (!matrix || !point) return null;
      const svgPoint = el.chart.createSVGPoint();
      svgPoint.x = point.svgX;
      svgPoint.y = point.svgY;
      const clientPoint = svgPoint.matrixTransform(matrix);
      return { x: clientPoint.x, y: clientPoint.y };
    }

    function chartPointContentPosition(point) {
      const clientPoint = chartPointClientPosition(point);
      if (!clientPoint) return null;
      const bounds = el.wrap.getBoundingClientRect();
      if (!bounds.width || !bounds.height) return null;
      return {
        x: clampPercent(((clientPoint.x - bounds.left) / bounds.width) * 100),
        y: clampPercent(((clientPoint.y - bounds.top) / bounds.height) * 100),
      };
    }

    function nearestChartPointAtClient(clientX, clientY) {
      let nearest = null;
      let nearestDistance = Infinity;
      state.chartPoints.forEach(point => {
        if (point.hidden) return;
        const clientPoint = chartPointClientPosition(point);
        if (!clientPoint) return;
        const distance = Math.hypot(clientPoint.x - clientX, clientPoint.y - clientY);
        if (distance < nearestDistance) {
          nearest = point;
          nearestDistance = distance;
        }
      });
      return nearest;
    }

    function nearestChartPointFromEvent(event) {
      return nearestChartPointAtClient(event.clientX, event.clientY);
    }

    function nearestChartPointFromContent(point) {
      const bounds = el.wrap.getBoundingClientRect();
      return nearestChartPointAtClient(
        bounds.left + bounds.width * point.x / 100,
        bounds.top + bounds.height * point.y / 100
      );
    }

    function anchoredPosition(anchor, fallbackX, fallbackY) {
      const chartPoint = chartPointForAnchor(anchor);
      const position = chartPointContentPosition(chartPoint);
      return {
        x: position?.x ?? fallbackX,
        y: position?.y ?? fallbackY,
        chartPoint,
        available: Boolean(position),
      };
    }

    function footnoteAnchorMarkup(note) {
      if (!note.anchor) return "";
      const resolved = anchoredPosition(note.anchor, note.x, note.y);
      const title = compactTitle(note.anchor.title);
      if (!resolved.available) {
        return `<div class="footnote-anchor unavailable">📎 ${escapeHtml(title)} · ${escapeHtml(note.anchor.period)} · точка вне выбранного периода</div>`;
      }
      return `<div class="footnote-anchor">📎 ${escapeHtml(title)} · ${escapeHtml(note.anchor.period)} · ${escapeHtml(formatValue(resolved.chartPoint.value, resolved.chartPoint.dimension))}</div>`;
    }

    function migrateLegacyFootnoteAnchors(notes) {
      let changed = false;
      notes.forEach(note => {
        if (!note.anchor && typeof note.x === "number" && typeof note.y === "number") {
          const point = nearestChartPointFromContent({ x: note.x, y: note.y });
          const position = chartPointContentPosition(point);
          if (point && position) {
            note.anchor = chartAnchorFromPoint(point);
            note.x = position.x;
            note.y = position.y;
            changed = true;
          }
        }
        if (!note.targetAnchor && typeof note.targetX === "number" && typeof note.targetY === "number") {
          const point = nearestChartPointFromContent({ x: note.targetX, y: note.targetY });
          const position = chartPointContentPosition(point);
          if (point && position) {
            note.targetAnchor = chartAnchorFromPoint(point);
            note.targetX = position.x;
            note.targetY = position.y;
            changed = true;
          }
        }
      });
      return changed;
    }

    function syncFootnoteFallbackPositions(notes) {
      let changed = false;
      notes.forEach(note => {
        const position = anchoredPosition(note.anchor, note.x, note.y);
        if (note.anchor && position.available && (
          typeof note.x !== "number" || typeof note.y !== "number" ||
          Math.abs(note.x - position.x) > 0.001 || Math.abs(note.y - position.y) > 0.001
        )) {
          note.x = position.x;
          note.y = position.y;
          changed = true;
        }
        const target = anchoredPosition(note.targetAnchor, note.targetX, note.targetY);
        if (note.targetAnchor && target.available && (
          typeof note.targetX !== "number" || typeof note.targetY !== "number" ||
          Math.abs(note.targetX - target.x) > 0.001 || Math.abs(note.targetY - target.y) > 0.001
        )) {
          note.targetX = target.x;
          note.targetY = target.y;
          changed = true;
        }
      });
      return changed;
    }

    function findFootnote(notes, id) {
      return notes.find(item => item.id === id);
    }

    function updateFootnote(id, updater) {
      const notes = footnotesForCurrentView();
      const note = findFootnote(notes, id);
      if (!note) return;
      updater(note);
      saveFootnotes(notes);
      renderFootnotes();
    }

    function hydrateEmbeddedNotes() {
      const shouldOverwriteFromEmbedded = embeddedNotesToken && storageGet(embeddedNotesTokenKey) !== embeddedNotesToken;
      Object.entries(embeddedNotes).forEach(([key, value]) => {
        if (typeof value !== "string") return;
        if (!key.startsWith(notesStoragePrefix) && !key.startsWith(footnotesStoragePrefix)) return;
        if (shouldOverwriteFromEmbedded || storageGet(key) === null) storageSet(key, value);
      });
      if (embeddedNotesToken) storageSet(embeddedNotesTokenKey, embeddedNotesToken);
    }

    function loadNote() {
      const key = noteKey();
      if (el.notesArea.dataset.key === key) return;
      el.notesArea.dataset.key = key;
      const shouldPreferEmbedded = embeddedNotesToken && storageGet(embeddedNotesTokenKey) !== embeddedNotesToken && embeddedNotes[key] !== undefined;
      el.notesArea.value = shouldPreferEmbedded ? embeddedNotes[key] : (storageGet(key) ?? embeddedNotes[key] ?? "");
      el.notesStatus.textContent = el.notesArea.value ? "Заметка загружена" : "Сохраняется автоматически";
    }

    function saveNote() {
      const key = el.notesArea.dataset.key || noteKey();
      storageSet(key, el.notesArea.value);
      el.notesStatus.textContent = `Сохранено ${new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}`;
    }

    function setFootnoteAddMode(active) {
      state.addingFootnote = active;
      state.placingArrowFor = null;
      el.wrap.classList.toggle("adding-footnote", active);
      el.wrap.classList.remove("placing-footnote-arrow");
      el.addFootnoteButton.classList.toggle("active", active);
      el.addFootnoteButton.textContent = active ? "Кликните точку" : "Добавить сноску";
    }

    function startFootnoteMove(event, noteId) {
      event.preventDefault();
      event.stopPropagation();
      setFootnoteAddMode(false);
      const notes = footnotesForCurrentView();
      const note = findFootnote(notes, noteId);
      if (!note) return;
      const marker = event.currentTarget.closest(".footnote-marker");
      const line = [...el.footnoteLayer.querySelectorAll(".footnote-arrow-line")].find(item => item.dataset.id === noteId);
      const start = contentPointFromEvent(event);
      const resolved = anchoredPosition(note.anchor, note.x, note.y);
      note.x = resolved.x;
      note.y = resolved.y;
      const original = { x: resolved.x, y: resolved.y };
      let moved = false;

      function move(moveEvent) {
        const point = contentPointFromEvent(moveEvent);
        const nextX = clampPercent(original.x + point.x - start.x);
        const nextY = clampPercent(original.y + point.y - start.y);
        if (Math.abs(nextX - original.x) > 0.2 || Math.abs(nextY - original.y) > 0.2) moved = true;
        note.x = nextX;
        note.y = nextY;
        marker.style.left = `${note.x}%`;
        marker.style.top = `${note.y}%`;
        if (line) {
          line.setAttribute("x1", note.x);
          line.setAttribute("y1", note.y);
        }
      }

      function stop() {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", stop);
        if (moved) {
          const point = nearestChartPointFromContent({ x: note.x, y: note.y });
          const position = chartPointContentPosition(point);
          if (point && position) {
            note.anchor = chartAnchorFromPoint(point);
            note.x = position.x;
            note.y = position.y;
          }
          saveFootnotes(notes);
          renderFootnotes();
        } else {
          note.pinned = !note.pinned;
          saveFootnotes(notes);
          renderFootnotes();
        }
      }

      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", stop);
    }

    function startFootnoteArrow(event, noteId) {
      event.preventDefault();
      event.stopPropagation();
      setFootnoteAddMode(false);
      state.placingArrowFor = noteId;
      el.wrap.classList.add("placing-footnote-arrow");
      const notes = footnotesForCurrentView();
      const note = findFootnote(notes, noteId);
      if (!note) return;
      const arrowSvg = el.footnoteLayer.querySelector(".footnote-arrows");
      let line = [...el.footnoteLayer.querySelectorAll(".footnote-arrow-line")].find(item => item.dataset.id === noteId);
      if (!line) {
        line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.classList.add("footnote-arrow-line");
        line.dataset.id = noteId;
        line.setAttribute("marker-end", "url(#footnote-arrowhead)");
        arrowSvg.appendChild(line);
      }
      const notePosition = anchoredPosition(note.anchor, note.x, note.y);
      line.setAttribute("x1", notePosition.x);
      line.setAttribute("y1", notePosition.y);

      function move(moveEvent) {
        const point = contentPointFromEvent(moveEvent);
        line.setAttribute("x2", point.x);
        line.setAttribute("y2", point.y);
      }

      function stop(upEvent) {
        const fallback = contentPointFromEvent(upEvent);
        const point = nearestChartPointFromEvent(upEvent);
        const position = chartPointContentPosition(point);
        if (point && position) {
          note.targetAnchor = chartAnchorFromPoint(point);
          note.targetX = position.x;
          note.targetY = position.y;
        } else {
          delete note.targetAnchor;
          note.targetX = fallback.x;
          note.targetY = fallback.y;
        }
        saveFootnotes(notes);
        state.placingArrowFor = null;
        el.wrap.classList.remove("placing-footnote-arrow");
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", stop);
        renderFootnotes();
      }

      move(event);
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", stop);
    }

    function renderFootnotes() {
      const notes = footnotesForCurrentView();
      const anchorsMigrated = migrateLegacyFootnoteAnchors(notes);
      const positionsChanged = syncFootnoteFallbackPositions(notes);
      const notesChanged = anchorsMigrated || positionsChanged;
      if (notesChanged) saveFootnotes(notes);
      el.footnoteLayer.innerHTML = "";
      const arrowSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      arrowSvg.classList.add("footnote-arrows");
      arrowSvg.setAttribute("viewBox", "0 0 100 100");
      arrowSvg.setAttribute("preserveAspectRatio", "none");
      arrowSvg.innerHTML = `
        <defs>
          <marker id="footnote-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L8,4 L0,8 Z" fill="#ffe27a"></path>
          </marker>
        </defs>
      `;
      notes.forEach(note => {
        if (!note.targetAnchor && (typeof note.targetX !== "number" || typeof note.targetY !== "number")) return;
        const notePosition = anchoredPosition(note.anchor, note.x, note.y);
        const targetPosition = anchoredPosition(note.targetAnchor, note.targetX, note.targetY);
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.classList.add("footnote-arrow-line");
        line.dataset.id = note.id;
        line.setAttribute("x1", notePosition.x);
        line.setAttribute("y1", notePosition.y);
        line.setAttribute("x2", targetPosition.x);
        line.setAttribute("y2", targetPosition.y);
        line.setAttribute("marker-end", "url(#footnote-arrowhead)");
        arrowSvg.appendChild(line);
      });
      el.footnoteLayer.appendChild(arrowSvg);
      notes.forEach((note, index) => {
        const position = anchoredPosition(note.anchor, note.x, note.y);
        const marker = document.createElement("div");
        marker.className = `footnote-marker${note.pinned ? " pinned" : ""}`;
        marker.style.left = `${position.x}%`;
        marker.style.top = `${position.y}%`;
        marker.dataset.id = note.id;
        marker.innerHTML = `
          <button class="footnote-dot" type="button" title="Перетащите, чтобы прикрепить к другой точке">${index + 1}</button>
          <div class="footnote-card">
            <div class="footnote-text">${escapeHtml(note.text)}</div>
            ${footnoteAnchorMarkup(note)}
            <div class="footnote-tools">
              <button type="button" data-action="pin" title="${note.pinned ? "Открепить" : "Закрепить"}" aria-label="${note.pinned ? "Открепить" : "Закрепить"}">${note.pinned ? "📍" : "📌"}</button>
              <button type="button" data-action="arrow" title="Привязать стрелку к точке" aria-label="Привязать стрелку к точке">↗</button>
              ${note.targetAnchor || typeof note.targetX === "number" ? '<button type="button" data-action="clearArrow" title="Убрать стрелку" aria-label="Убрать стрелку">∅</button>' : ""}
              <button type="button" data-action="edit" title="Править" aria-label="Править">✎</button>
              <button type="button" data-action="delete" title="Удалить" aria-label="Удалить">🗑</button>
            </div>
          </div>
        `;
        marker.querySelector(".footnote-dot").addEventListener("pointerdown", event => startFootnoteMove(event, note.id));
        marker.querySelector('[data-action="arrow"]').addEventListener("pointerdown", event => startFootnoteArrow(event, note.id));
        marker.querySelector(".footnote-tools").addEventListener("click", event => {
          event.stopPropagation();
          const action = event.target?.dataset?.action;
          if (action === "arrow") return;
          const updated = footnotesForCurrentView();
          const targetIndex = updated.findIndex(item => item.id === note.id);
          if (targetIndex < 0) return;
          if (action === "pin") {
            updated[targetIndex].pinned = !updated[targetIndex].pinned;
          } else if (action === "edit") {
            const text = window.prompt("Текст сноски", updated[targetIndex].text);
            if (text === null) return;
            updated[targetIndex].text = text.trim();
            if (!updated[targetIndex].text) updated.splice(targetIndex, 1);
          } else if (action === "delete") {
            updated.splice(targetIndex, 1);
          } else if (action === "clearArrow") {
            delete updated[targetIndex].targetX;
            delete updated[targetIndex].targetY;
            delete updated[targetIndex].targetAnchor;
          }
          saveFootnotes(updated);
          renderFootnotes();
        });
        el.footnoteLayer.appendChild(marker);
      });
    }

    function addFootnoteAt(event) {
      if (!state.addingFootnote) return;
      if (event.target.closest("button, select, textarea, input, a, .footnote-marker")) return;
      const point = nearestChartPointFromEvent(event);
      const position = chartPointContentPosition(point);
      if (!point || !position) {
        setFootnoteAddMode(false);
        return;
      }
      const text = window.prompt("Текст сноски");
      setFootnoteAddMode(false);
      if (!text || !text.trim()) return;
      const notes = footnotesForCurrentView();
      notes.push({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        x: position.x,
        y: position.y,
        anchor: chartAnchorFromPoint(point),
        text: text.trim(),
        pinned: false,
      });
      saveFootnotes(notes);
      renderFootnotes();
    }

    function collectNotes() {
      const notes = { ...embeddedNotes };
      saveNote();
      for (let index = 0; index < storageLength(); index += 1) {
        const key = storageKey(index);
        if (!key || (!key.startsWith(notesStoragePrefix) && !key.startsWith(footnotesStoragePrefix))) continue;
        const value = storageGet(key) || "";
        if (value.trim() && value !== "[]") notes[key] = value;
        else delete notes[key];
      }
      const currentKey = noteKey();
      if (el.notesArea.value.trim()) notes[currentKey] = el.notesArea.value;
      else delete notes[currentKey];
      const currentFootnotesKey = footnotesKey();
      const currentFootnotes = storageGet(currentFootnotesKey);
      if (currentFootnotes && currentFootnotes !== "[]") notes[currentFootnotesKey] = currentFootnotes;
      notes.__exportId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      return notes;
    }

    function downloadHtmlWithNotes() {
      const notes = collectNotes();
      const notesScript = document.getElementById("dashboard-notes");
      notesScript.textContent = JSON.stringify(notes).replace(/</g, "\\u003c");
      const html = `<!doctype html>\n${document.documentElement.outerHTML}`;
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "dashboard_with_notes.html";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      el.notesStatus.textContent = "HTML с заметками скачан";
    }

    function colorIndexForTitle(title) {
      const index = allRowsForSelection().findIndex(row => row.title === title);
      return index < 0 ? 0 : index;
    }

    function colorForTitle(title) {
      return palette[colorIndexForTitle(title) % palette.length];
    }

    function rgbaFromHex(hex, alpha) {
      const clean = hex.replace("#", "");
      const value = parseInt(clean.length === 3 ? clean.split("").map(char => char + char).join("") : clean, 16);
      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function addGlassBar(add, x, y, width, height, color) {
      const attrs = {
        x,
        y,
        width,
        height: Math.max(0.7, height),
        rx: Math.min(7, width / 2),
        fill: color,
        opacity: 0.48,
        stroke: "rgba(255, 255, 255, 0.36)",
        "stroke-width": "0.9",
        filter: "url(#glass-glow)",
      };
      add("rect", attrs);
      add("rect", {
        x: x + Math.max(1, width * 0.12),
        y: y + 1,
        width: Math.max(1, width * 0.26),
        height: Math.max(0, height - 2),
        rx: Math.min(5, width / 4),
        fill: "rgba(255, 255, 255, 0.24)",
        opacity: 0.62,
      });
    }

    function addPreviewBar(add, x, y, width, height, color) {
      add("rect", {
        x,
        y,
        width,
        height: Math.max(0.7, height),
        rx: 4,
        fill: color,
        opacity: 0.76,
        stroke: rgbaFromHex(color, 0.42),
        "stroke-width": "0.8",
        filter: "url(#glass-glow)",
      });
    }

    function isExpenseStructure(rows) {
      return rows.some(row => (row.slice || "").toLowerCase().includes("структура расходов"));
    }

    function usesCompressedNegativePercentScale(rows) {
      return rows.some(row => {
        const slice = (row.slice || "").toLowerCase();
        return slice.includes("структура расходов") || (slice.includes("дрр") && slice.includes("соинвест"));
      });
    }

    function usesFlexiblePercentDomain(rows) {
      return isExpenseStructure(rows);
    }

    function isBarRow(row) {
      return row.chartType.includes("гист") || row.chartType.includes("bar") || row.chartType.includes("hist");
    }

    function isRightAxis(row) {
      return row.axis.includes("прав");
    }

    function isStackedBarSet(rows) {
      return rows.filter(isBarRow).length > 1;
    }

    function stackDisplayRows(rows, periodIndex = null) {
      const index = periodIndex ?? Math.max(0, (rows[0]?.values?.length || 1) - 1);
      const positive = [];
      const negative = [];
      const empty = [];
      rows.forEach(row => {
        const value = row.values[index];
        if (typeof value !== "number" || !Number.isFinite(value)) empty.push(row);
        else if (value >= 0) positive.push(row);
        else negative.push(row);
      });
      return [...positive.reverse(), ...negative, ...empty];
    }

    function displayRowsForLegend(rows) {
      const allRows = allRowsForSelection();
      return isStackedBarSet(allRows) ? stackDisplayRows(allRows) : allRows;
    }

    function rowsForTooltip(rows, periodIndex) {
      return isStackedBarSet(rows) ? stackDisplayRows(rows, periodIndex) : rows;
    }

    function nicePercentStep(range) {
      return [0.1, 0.2, 0.5, 1, 2, 5].find(step => range / step <= 7) || 10;
    }

    function niceNumberStep(range) {
      if (!Number.isFinite(range) || range <= 0) return 10;
      const raw = range / 5;
      const power = Math.pow(10, Math.floor(Math.log10(raw)));
      const factor = [1, 2, 5, 10].find(item => raw <= item * power) || 10;
      return Math.max(10, factor * power);
    }

    function axisTicks(domain, dimension = "number") {
      if (dimension === "percent" && domain[0] === -1 && domain[1] === 1) {
        return [-1, 0, 1];
      }
      const range = Math.max(Math.abs(domain[1] - domain[0]), 0.000001);
      const step = dimension === "percent" ? nicePercentStep(range) : niceNumberStep(range);
      const min = Math.floor(domain[0] / step) * step;
      const max = Math.ceil(domain[1] / step) * step;
      const ticks = [];
      for (let value = min; value <= max + step / 2; value += step) {
        ticks.push(Number(value.toFixed(10)));
      }
      return ticks.length ? ticks : [0, step];
    }

    function shouldShowBarLabel(row, value) {
      return row.dimension === "percent" && typeof value === "number" && Number.isFinite(value) && Math.abs(value) >= 0.01;
    }

    function addBarLabel(add, x, y, h, value, row) {
      if (!shouldShowBarLabel(row, value)) return;
      const label = formatValue(value, row.dimension);
      add("text", {
        x,
        y: y + h / 2,
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        fill: "#fff4c2",
        "font-size": "14",
        "font-weight": "800",
        "paint-order": "stroke",
        stroke: "rgba(1, 7, 20, 0.92)",
        "stroke-width": "3.8",
      }).textContent = label;
    }

    function visibleWindow(rows) {
      const sourcePeriods = rows[0]?.periods || [];
      const periods = selectedPeriods(sourcePeriods);
      return {
        periods,
        rows: rows.map(row => ({
          ...row,
          periods,
          values: periods.map(period => {
            const index = row.periods.indexOf(period);
            return index >= 0 ? row.values[index] : null;
          }),
        })),
      };
    }

    function slicesForCurrentFilter() {
      return byPreferredOrder(
        unique(currentCandidates().filter(record => record.filter === state.filter).map(record => record.slice)),
        ["GMV, Выкупы, Маржа", "Маржинальность", "Цены", "ДРР и Соинвест", "План / Факт", "ROI", "Структура расходов по неделям"]
      );
    }

    function rowsForSlice(slice) {
      return records.filter(record =>
        record.tab === state.mode &&
        record.filter === state.filter &&
        record.slice === slice
      );
    }

    function extent(rows, axisName) {
      const values = [];
      rows.filter(row => axisName === "right" ? isRightAxis(row) : !isRightAxis(row))
        .forEach(row => row.values.forEach(value => {
          if (typeof value === "number" && Number.isFinite(value)) values.push(value);
        }));
      if (!values.length) return [0, 1];
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min > 0) min = 0;
      if (max === min) max = min + 1;
      const pad = (max - min) * 0.08;
      return [min - pad, max + pad];
    }

    function stackedExtent(rows) {
      const periods = rows[0]?.periods || [];
      let min = 0;
      let max = 0;
      periods.forEach((_, index) => {
        let positive = 0;
        let negative = 0;
        rows.forEach(row => {
          const value = row.values[index];
          if (typeof value !== "number" || !Number.isFinite(value)) return;
          if (value >= 0) positive += value;
          else negative += value;
        });
        max = Math.max(max, positive);
        min = Math.min(min, negative);
      });
      if (max === min) max = min + 1;
      const pad = (max - min) * 0.08;
      return [min - pad, max + pad];
    }

    function pointsFor(row, periods, scaleX, scaleY, domain = null) {
      return row.values.map((value, index) => {
        if (typeof value !== "number" || !Number.isFinite(value)) return null;
        return [scaleX(index), scaleY(domain ? clampToDomain(value, domain) : value)];
      });
    }

    function pathFromPoints(points) {
      let path = "";
      points.forEach(point => {
        if (!point) return;
        path += `${path ? "L" : "M"}${point[0].toFixed(2)},${point[1].toFixed(2)}`;
      });
      return path;
    }

    function renderLegend(rows) {
      const allRows = displayRowsForLegend(rows);
      el.legend.innerHTML = "";
      allRows.forEach(row => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = state.hidden.has(row.title) ? "off" : "";
        button.title = compactTitle(row.title);
        const swatchColor = colorForTitle(row.title);
        button.innerHTML = `<span class="swatch" style="background:${swatchColor}; box-shadow:0 0 10px ${swatchColor}"></span><span>${escapeHtml(compactTitle(row.title))}</span>`;
        button.addEventListener("click", () => {
          if (state.hidden.has(row.title)) state.hidden.delete(row.title);
          else state.hidden.add(row.title);
          render();
        });
        el.legend.appendChild(button);
      });
    }

    function renderKpis(rows, periods) {
      el.kpis.innerHTML = "";
      rows.slice(0, 5).forEach(row => {
        const values = row.values.filter(value => typeof value === "number" && Number.isFinite(value));
        const total = values.length ? values.reduce((sum, value) => sum + value, 0) : null;
        const aggregateValue = total === null ? null : (row.dimension === "percent" ? total / values.length : total);
        const aggregationLabel = row.dimension === "percent" ? "Среднее за период" : "Сумма за период";
        const periodLabel = periods.length ? `${aggregationLabel} · ${periods.length} дат` : "Нет выбранных дат";
        const card = document.createElement("div");
        card.className = "kpi";
        card.innerHTML = `
          <div class="kpi-title">${escapeHtml(compactTitle(row.title))}</div>
          <div class="kpi-value">${formatValue(aggregateValue, row.dimension)}</div>
          <div class="kpi-delta">${escapeHtml(periodLabel)}</div>
        `;
        el.kpis.appendChild(card);
      });
    }

    function renderMiniChart(svg, sourceRows) {
      const windowed = visibleWindow(sourceRows);
      const rows = windowed.rows;
      const periods = windowed.periods;
      svg.innerHTML = "";
      if (!rows.length || !periods.length) return;

      const width = 360;
      const height = 170;
      const margin = { top: 12, right: 14, bottom: 18, left: 28 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const barRows = rows.filter(isBarRow);
      const lineRows = rows.filter(row => !barRows.includes(row));
      const useStackedBars = barRows.length > 1;
      const localColorForTitle = title => {
        const index = rows.findIndex(row => row.title === title);
        return palette[(index < 0 ? 0 : index) % palette.length];
      };

      let values = [];
      if (useStackedBars) {
        const domain = stackedExtent(barRows);
        values = [domain[0], domain[1]];
      } else {
        rows.forEach(row => row.values.forEach(value => {
          if (typeof value === "number" && Number.isFinite(value)) values.push(value);
        }));
      }
      const isPercentMini = rows.some(row => row.dimension === "percent");
      let min;
      let max;
      if (isPercentMini && usesFlexiblePercentDomain(rows)) {
        if (!values.length) values = [-1, 1];
        min = Math.min(...values);
        max = Math.max(...values);
        if (min > 0) min = 0;
        if (max < 1) max = 1;
        if (min > -1 && min < 0) min = -1;
        if (max === min) max = min + 1;
        const ticks = axisTicks([min, max], "percent");
        min = ticks[0];
        max = ticks[ticks.length - 1];
      } else if (isPercentMini) {
        min = -1;
        max = 1;
      } else {
        if (!values.length) values = [0, 1];
        min = Math.min(...values);
        max = Math.max(...values);
        if (min > 0) min = 0;
        if (max === min) max = min + 1;
        const pad = (max - min) * 0.08;
        min -= pad;
        max += pad;
      }

      const xPadding = barRows.length ? Math.min(48, Math.max(22, plotW / Math.max(periods.length, 1) * 0.55)) : 0;
      const usablePlotW = Math.max(1, plotW - xPadding * 2);
      const scaleX = index => margin.left + xPadding + (periods.length === 1 ? usablePlotW / 2 : (index / (periods.length - 1)) * usablePlotW);
      const useCompressedNegativeMini = isPercentMini && usesCompressedNegativePercentScale(rows) && min < 0 && max > 0;
      const scaleY = value => {
        if (!useCompressedNegativeMini) return margin.top + plotH - ((value - min) / (max - min)) * plotH;
        const positiveH = plotH * 4 / 5;
        const negativeH = plotH - positiveH;
        const zero = margin.top + positiveH;
        return value >= 0 ? zero - (value / max) * positiveH : zero + (value / min) * negativeH;
      };
      const zeroY = Math.max(margin.top, Math.min(margin.top + plotH, scaleY(0)));

      function add(tag, attrs) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        svg.appendChild(node);
        return node;
      }

      const defs = add("defs", {});
      defs.innerHTML = `
        <filter id="thumb-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="1.7" result="coloredBlur"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="coloredBlur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      `;

      add("line", { x1: margin.left, y1: zeroY, x2: width - margin.right, y2: zeroY, stroke: "rgba(169,209,255,.24)", "stroke-width": 1 });
      add("line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + plotH, stroke: "rgba(169,209,255,.20)", "stroke-width": 1 });

      if (useStackedBars) {
        const barWidth = Math.max(6, Math.min(22, plotW / periods.length * 0.62));
        const positiveStacks = new Array(periods.length).fill(0);
        const negativeStacks = new Array(periods.length).fill(0);
        barRows.forEach(row => {
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value) || value === 0) return;
            const base = value >= 0 ? positiveStacks[index] : negativeStacks[index];
            if (value >= 0) positiveStacks[index] += value;
            else negativeStacks[index] += value;
            const end = value >= 0 ? positiveStacks[index] : negativeStacks[index];
            const x = scaleX(index) - barWidth / 2;
            const clampedBase = isPercentMini ? clampToDomain(base, [min, max]) : base;
            const clampedEnd = isPercentMini ? clampToDomain(end, [min, max]) : end;
            const y = Math.min(scaleY(clampedBase), scaleY(clampedEnd));
            const h = Math.abs(scaleY(clampedBase) - scaleY(clampedEnd));
            add("rect", { x, y, width: barWidth, height: h, fill: localColorForTitle(row.title), opacity: 0.88, filter: "url(#thumb-glow)" });
          });
        });
      } else {
        barRows.forEach(row => {
          const barWidth = Math.max(5, Math.min(18, plotW / periods.length * 0.56));
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value)) return;
            const x = scaleX(index) - barWidth / 2;
            const clampedValue = isPercentMini ? clampToDomain(value, [min, max]) : value;
            const y = Math.min(scaleY(0), scaleY(clampedValue));
            const h = Math.abs(scaleY(0) - scaleY(clampedValue));
            add("rect", { x, y, width: barWidth, height: h, fill: localColorForTitle(row.title), opacity: 0.84, filter: "url(#thumb-glow)" });
          });
        });
      }

      lineRows.forEach(row => {
        const points = pointsFor(row, periods, scaleX, scaleY, isPercentMini ? [min, max] : null);
        const color = localColorForTitle(row.title);
        add("path", { d: pathFromPoints(points), fill: "none", stroke: rgbaFromHex(color, 0.36), "stroke-width": 4.2, "stroke-linecap": "round", "stroke-linejoin": "round" });
        add("path", { d: pathFromPoints(points), fill: "none", stroke: color, "stroke-width": 2.5, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.98 });
        points.forEach(point => {
          if (!point) return;
          add("circle", { cx: point[0], cy: point[1], r: 3.2, fill: color, opacity: 0.96 });
          add("circle", { cx: point[0], cy: point[1], r: 1.35, fill: "#fff8d6", opacity: 1 });
        });
      });
    }

    function renderChart(rows, periods) {
      const svg = el.chart;
      svg.innerHTML = "";
      el.tooltip.style.display = "none";
      state.chartPoints = [];
      if (!rows.length || !periods.length) {
        svg.innerHTML = `<foreignObject x="0" y="0" width="1040" height="500"><div class="empty">Нет данных для выбранных фильтров</div></foreignObject>`;
        return;
      }

      const width = 1040;
      const height = 500;
      const margin = { top: 16, right: rows.some(isRightAxis) ? 78 : 28, bottom: 76, left: 78 };
      const plotW = width - margin.left - margin.right;
      const plotH = height - margin.top - margin.bottom;
      const barRows = rows.filter(isBarRow);
      const lineRows = rows.filter(row => !barRows.includes(row));
      const useStackedBars = barRows.length > 1;
      const usePreviewBarStyle = isExpenseStructure(rows);

      let leftDomain = useStackedBars ? stackedExtent(barRows.filter(row => !isRightAxis(row))) : extent(rows, "left");
      let rightDomain = extent(rows, "right");
      const leftSample = rows.find(row => !isRightAxis(row)) || rows[0];
      const rightSample = rows.find(isRightAxis) || rows[0];
      if (isPercentAxis(rows, "left") && !usesFlexiblePercentDomain(rows)) leftDomain = [-1, 1];
      if (isPercentAxis(rows, "left") && usesFlexiblePercentDomain(rows)) {
        if (leftDomain[1] < 1) leftDomain[1] = 1;
        if (leftDomain[0] > -1 && leftDomain[0] < 0) leftDomain[0] = -1;
      }
      if (isPercentAxis(rows, "right")) rightDomain = [-1, 1];
      const leftDimension = isPercentAxis(rows, "left") ? "percent" : leftSample.dimension;
      const rightDimension = isPercentAxis(rows, "right") ? "percent" : rightSample.dimension;
      const leftTicks = axisTicks(leftDomain, leftDimension);
      const rightTicks = axisTicks(rightDomain, rightDimension);
      leftDomain = [leftTicks[0], leftTicks[leftTicks.length - 1]];
      rightDomain = [rightTicks[0], rightTicks[rightTicks.length - 1]];
      const xPadding = barRows.length ? Math.min(48, Math.max(22, plotW / Math.max(periods.length, 1) * 0.55)) : 0;
      const usablePlotW = Math.max(1, plotW - xPadding * 2);
      const scaleX = index => margin.left + xPadding + (periods.length === 1 ? usablePlotW / 2 : (index / (periods.length - 1)) * usablePlotW);
      function yScale(domain, compressNegative = false) {
        if (!compressNegative || domain[0] >= 0 || domain[1] <= 0) {
          return value => margin.top + plotH - ((value - domain[0]) / (domain[1] - domain[0])) * plotH;
        }
        const positiveH = plotH * 4 / 5;
        const negativeH = plotH - positiveH;
        const zero = margin.top + positiveH;
        return value => value >= 0 ? zero - (value / domain[1]) * positiveH : zero + (value / domain[0]) * negativeH;
      }
      const useCompressedNegativeScale = usesCompressedNegativePercentScale(rows) && isPercentAxis(rows, "left");
      const leftY = yScale(leftDomain, useCompressedNegativeScale);
      const rightY = yScale(rightDomain, false);
      const zeroY = Math.max(margin.top, Math.min(margin.top + plotH, leftY(0)));
      const registeredPointKeys = new Set();

      function chartPointKey(row, index) {
        return `${row.sheet || ""}\u001f${row.title}\u001f${periods[index]}`;
      }

      function rememberChartPoint(row, index, svgX, svgY, hidden = false) {
        const value = row.values[index];
        if (typeof value !== "number" || !Number.isFinite(value) || !Number.isFinite(svgX) || !Number.isFinite(svgY)) return;
        const key = chartPointKey(row, index);
        if (registeredPointKeys.has(key)) return;
        registeredPointKeys.add(key);
        state.chartPoints.push({
          sheet: row.sheet || "",
          title: row.title,
          period: periods[index],
          value,
          dimension: row.dimension,
          svgX,
          svgY,
          hidden,
        });
      }

      function add(tag, attrs, parent = svg) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        parent.appendChild(node);
        return node;
      }

      const defs = add("defs", {});
      defs.innerHTML = `
        <filter id="glass-glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="2.8" result="coloredBlur"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="coloredBlur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      `;

      leftTicks.forEach(value => {
        const y = leftY(value);
        add("line", { x1: margin.left, y1: y, x2: width - margin.right, y2: y, class: "grid" });
        add("text", { x: margin.left - 10, y: y + 4, "text-anchor": "end", class: "axis-text" }).textContent = formatValue(value, leftDimension);
      });

      add("line", { x1: margin.left, y1: zeroY, x2: width - margin.right, y2: zeroY, class: "axis" });
      add("line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + plotH, class: "axis" });
      if (rows.some(isRightAxis)) {
        add("line", { x1: width - margin.right, y1: margin.top, x2: width - margin.right, y2: margin.top + plotH, class: "axis" });
        rightTicks.forEach(value => {
          const y = rightY(value);
          add("text", { x: width - margin.right + 10, y: y + 4, "text-anchor": "start", class: "axis-text" }).textContent = formatValue(value, rightDimension);
        });
      }

      const tickStep = Math.max(1, Math.ceil(periods.length / 14));
      const tickIndexes = [];
      periods.forEach((_, index) => {
        if (index % tickStep === 0) tickIndexes.push(index);
      });
      if (!tickIndexes.includes(periods.length - 1)) {
        if (periods.length - 1 - tickIndexes[tickIndexes.length - 1] < Math.max(2, Math.floor(tickStep * 0.7))) {
          tickIndexes[tickIndexes.length - 1] = periods.length - 1;
        } else {
          tickIndexes.push(periods.length - 1);
        }
      }
      tickIndexes.forEach(index => {
        const period = periods[index];
        const x = scaleX(index);
        add("text", { x, y: height - 30, "text-anchor": "end", transform: `rotate(-38 ${x} ${height - 30})`, class: "axis-text" }).textContent = period;
      });

      if (useStackedBars) {
        const barWidth = usePreviewBarStyle
          ? Math.max(7, Math.min(34, usablePlotW / periods.length * 0.62))
          : Math.max(8, Math.min(44, usablePlotW / periods.length * 0.84));
        const positiveStacks = new Array(periods.length).fill(0);
        const negativeStacks = new Array(periods.length).fill(0);
        barRows.forEach(row => {
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value) || value === 0) return;
            const base = value >= 0 ? positiveStacks[index] : negativeStacks[index];
            if (value >= 0) positiveStacks[index] += value;
            else negativeStacks[index] += value;
            const end = value >= 0 ? positiveStacks[index] : negativeStacks[index];
            const x = scaleX(index) - barWidth / 2;
            const clampedBase = isPercentAxis(rows, "left") ? clampToDomain(base, leftDomain) : base;
            const clampedEnd = isPercentAxis(rows, "left") ? clampToDomain(end, leftDomain) : end;
            const y = Math.min(leftY(clampedBase), leftY(clampedEnd));
            const h = Math.abs(leftY(clampedBase) - leftY(clampedEnd));
            rememberChartPoint(row, index, scaleX(index), leftY(clampedEnd));
            if (usePreviewBarStyle) addPreviewBar(add, x, y, barWidth, h, colorForTitle(row.title));
            else addGlassBar(add, x, y, barWidth, h, colorForTitle(row.title));
            addBarLabel(add, x + barWidth / 2, y, h, value, row);
          });
        });
      } else {
        const barWidth = usePreviewBarStyle
          ? Math.max(6, Math.min(28, usablePlotW / periods.length * 0.56))
          : Math.max(7, Math.min(32, usablePlotW / periods.length * 0.78));
        barRows.forEach(row => {
          const axisY = isRightAxis(row) ? rightY : leftY;
          const axisDomain = isRightAxis(row) ? rightDomain : leftDomain;
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value)) return;
            const clampedValue = row.dimension === "percent" ? clampToDomain(value, axisDomain) : value;
            const y = axisY(Math.max(clampedValue, 0));
            const h = Math.abs(axisY(0) - axisY(clampedValue));
            const x = scaleX(index) - barWidth / 2;
            rememberChartPoint(row, index, scaleX(index), axisY(clampedValue));
            if (usePreviewBarStyle) addPreviewBar(add, x, y, barWidth, h, colorForTitle(row.title));
            else addGlassBar(add, x, y, barWidth, h, colorForTitle(row.title));
            addBarLabel(add, x + barWidth / 2, y, h, value, row);
          });
        });
      }

      lineRows.forEach(row => {
        const axisY = isRightAxis(row) ? rightY : leftY;
        const axisDomain = isRightAxis(row) ? rightDomain : leftDomain;
        const points = pointsFor(row, periods, scaleX, axisY, row.dimension === "percent" ? axisDomain : null);
        const color = colorForTitle(row.title);
        const isDashed = row.chartType.includes("прерыв") || row.chartType.includes("dash");
        const path = pathFromPoints(points);
        add("path", { d: path, fill: "none", stroke: rgbaFromHex(color, 0.36), "stroke-width": 6.2, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": isDashed ? "8 5" : "none", opacity: 0.66 });
        add("path", { d: path, fill: "none", stroke: color, "stroke-width": 3.3, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": isDashed ? "8 5" : "none", opacity: 0.98 });
        add("path", { d: path, fill: "none", stroke: "rgba(255,255,255,0.72)", "stroke-width": 0.9, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": isDashed ? "8 5" : "none", opacity: 0.76 });
        points.forEach((point, index) => {
          if (!point) return;
          rememberChartPoint(row, index, point[0], point[1]);
          add("circle", { cx: point[0], cy: point[1], r: 5.8, fill: rgbaFromHex(color, 0.28), opacity: 1 });
          add("circle", { cx: point[0], cy: point[1], r: 3.8, fill: color, opacity: 0.98 });
          add("circle", { cx: point[0], cy: point[1], r: 1.55, fill: "#fff8d6", opacity: 1 });
        });
      });

      const referenceRows = visibleWindow(allRowsForSelection()).rows;
      const hiddenLineRows = referenceRows.filter(row => state.hidden.has(row.title) && !isBarRow(row));
      const hiddenBarRows = referenceRows.filter(row => state.hidden.has(row.title) && isBarRow(row));

      hiddenLineRows.forEach(row => {
        const axisY = isRightAxis(row) ? rightY : leftY;
        const axisDomain = isRightAxis(row) ? rightDomain : leftDomain;
        row.values.forEach((value, index) => {
          if (typeof value !== "number" || !Number.isFinite(value)) return;
          rememberChartPoint(row, index, scaleX(index), axisY(clampToDomain(value, axisDomain)), true);
        });
      });

      if (useStackedBars) {
        const positiveStacks = new Array(periods.length).fill(0);
        const negativeStacks = new Array(periods.length).fill(0);
        referenceRows.filter(isBarRow).forEach(row => {
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value)) return;
            if (value >= 0) positiveStacks[index] += value;
            else negativeStacks[index] += value;
            if (!state.hidden.has(row.title)) return;
            const end = value >= 0 ? positiveStacks[index] : negativeStacks[index];
            rememberChartPoint(row, index, scaleX(index), leftY(clampToDomain(end, leftDomain)), true);
          });
        });
      } else {
        hiddenBarRows.forEach(row => {
          const axisY = isRightAxis(row) ? rightY : leftY;
          const axisDomain = isRightAxis(row) ? rightDomain : leftDomain;
          row.values.forEach((value, index) => {
            if (typeof value !== "number" || !Number.isFinite(value)) return;
            rememberChartPoint(row, index, scaleX(index), axisY(clampToDomain(value, axisDomain)), true);
          });
        });
      }

      const hover = add("rect", { x: margin.left, y: margin.top, width: plotW, height: plotH, fill: "transparent" });
      const guide = add("line", { x1: margin.left, y1: margin.top, x2: margin.left, y2: margin.top + plotH, stroke: "#94a3b8", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: 0 });
      hover.addEventListener("mousemove", event => {
        const point = svg.createSVGPoint();
        point.x = event.clientX;
        point.y = event.clientY;
        const svgPoint = point.matrixTransform(svg.getScreenCTM().inverse());
        const mouseX = svgPoint.x;
        const index = Math.max(0, Math.min(periods.length - 1, Math.round(((mouseX - margin.left - xPadding) / usablePlotW) * (periods.length - 1))));
        const x = scaleX(index);
        guide.setAttribute("x1", x);
        guide.setAttribute("x2", x);
        guide.setAttribute("opacity", "1");
        el.tooltip.innerHTML = `<strong>${escapeHtml(periods[index])}</strong>` + rowsForTooltip(rows, index).map(row => `
          <div class="tooltip-row">
            <span class="swatch" style="background:${colorForTitle(row.title)}"></span>
            <span>${escapeHtml(compactTitle(row.title))}</span>
            <b>${formatValue(row.values[index], row.dimension)}</b>
          </div>
        `).join("");
        el.tooltip.style.display = "block";
        const wrapBounds = el.wrap.getBoundingClientRect();
        const tooltipX = event.clientX - wrapBounds.left + 14;
        const tooltipY = event.clientY - wrapBounds.top - 20;
        el.tooltip.style.left = `${Math.max(8, Math.min(tooltipX, el.wrap.clientWidth - 380))}px`;
        el.tooltip.style.top = `${Math.max(8, tooltipY)}px`;
      });
      hover.addEventListener("mouseleave", () => {
        guide.setAttribute("opacity", "0");
        el.tooltip.style.display = "none";
      });
    }

    function renderTable(rows, periods) {
      el.table.innerHTML = `
        <thead><tr><th>Показатель</th>${periods.map(period => `<th>${escapeHtml(period)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(row => `
          <tr style="background:linear-gradient(90deg, ${rgbaFromHex(colorForTitle(row.title), 0.18)}, rgba(255,255,255,0.025));">
            <td>${escapeHtml(compactTitle(row.title))}</td>
            ${periods.map((_, index) => `<td>${formatValue(row.values[index], row.dimension)}</td>`).join("")}
          </tr>
        `).join("")}</tbody>
      `;
    }

    function renderGallery() {
      const slices = slicesForCurrentFilter();
      const totalRows = slices.reduce((total, slice) => total + rowsForSlice(slice).length, 0);
      state.chartPoints = [];
      loadNote();
      el.content.classList.add("gallery-mode");
      el.backButton.style.display = "none";
      el.addFootnoteButton.style.display = "none";
      el.legend.style.display = "none";
      el.wrap.style.display = "none";
      el.chartBody.style.display = "none";
      el.chartSidebar.style.display = "none";
      el.tablePanel.style.display = "none";
      el.thumbnailGrid.style.display = "grid";
      el.kpis.innerHTML = "";
      el.title.textContent = `${modeLabels[state.mode] || state.mode}: ${state.filter}`;
      el.meta.textContent = "Выберите график для увеличения";
      el.seriesCount.textContent = `${slices.length} графиков`;
      el.periodCount.textContent = `${totalRows} рядов`;
      el.thumbnailGrid.innerHTML = "";

      slices.forEach(slice => {
        const rows = rowsForSlice(slice);
        const periods = rows[0]?.periods || [];
        const card = document.createElement("button");
        card.type = "button";
        card.className = "thumb-card";
        card.innerHTML = `
          <h3 class="thumb-title">${escapeHtml(slice)}</h3>
          <div class="thumb-meta">${rows.length} рядов · ${periods.length} дат</div>
          <svg viewBox="0 0 360 170" role="img" aria-label="${escapeHtml(slice)}"></svg>
        `;
        card.addEventListener("click", () => {
          setFootnoteAddMode(false);
          state.slice = slice;
          state.view = "detail";
          state.hidden.clear();
          resetDateSelection();
          render();
        });
        el.thumbnailGrid.appendChild(card);
        renderMiniChart(card.querySelector("svg"), rows);
      });
      renderFootnotes();
    }

    function render() {
      syncControls();
      syncDatePicker();
      if (state.view === "gallery") {
        renderGallery();
        return;
      }
      const allRows = allRowsForSelection();
      const visibleRows = currentRows();
      const windowed = visibleWindow(visibleRows);
      loadNote();
      el.content.classList.remove("gallery-mode");
      el.backButton.style.display = "inline-flex";
      el.addFootnoteButton.style.display = "inline-flex";
      el.legend.style.display = "grid";
      el.chartSidebar.style.display = "grid";
      el.wrap.style.display = "block";
      el.chartBody.style.display = "grid";
      el.tablePanel.style.display = "block";
      el.thumbnailGrid.style.display = "none";
      el.title.textContent = `${modeLabels[state.mode] || state.mode}: ${state.filter}`;
      el.meta.textContent = state.slice;
      el.seriesCount.textContent = `${allRows.length} рядов`;
      el.periodCount.textContent = `${windowed.periods.length || 0} дат`;
      renderLegend(visibleRows);
      renderKpis(windowed.rows, windowed.periods);
      renderChart(windowed.rows, windowed.periods);
      renderTable(windowed.rows, windowed.periods);
      renderFootnotes();
    }

    el.filterSelect.addEventListener("change", () => {
      setFootnoteAddMode(false);
      state.filter = el.filterSelect.value;
      state.slice = "";
      state.view = "gallery";
      state.hidden.clear();
      resetDateSelection();
      render();
    });

    el.sliceSelect.addEventListener("change", () => {
      setFootnoteAddMode(false);
      state.slice = el.sliceSelect.value;
      state.view = state.slice ? "detail" : "gallery";
      state.hidden.clear();
      resetDateSelection();
      render();
    });

    el.dateDropdownButton.addEventListener("click", () => {
      const willOpen = el.dateDropdownPanel.hidden;
      el.dateDropdownPanel.hidden = !willOpen;
      el.dateDropdownButton.setAttribute("aria-expanded", String(willOpen));
    });

    el.calendarPrev.addEventListener("click", () => moveCalendarMonth(-1));
    el.calendarNext.addEventListener("click", () => moveCalendarMonth(1));
    el.datePresets.addEventListener("click", event => {
      const button = event.target.closest("[data-days]");
      if (button) applyQuickDateRange(Number(button.dataset.days));
    });
    el.allDateRange.addEventListener("click", () => {
      state.dateStart = null;
      state.dateEnd = null;
      state.selectingRangeEnd = false;
      render();
    });

    document.addEventListener("click", event => {
      if (!el.datePicker.contains(event.target)) closeDateDropdown();
    });

    el.backButton.addEventListener("click", () => {
      setFootnoteAddMode(false);
      state.slice = "";
      state.view = "gallery";
      state.hidden.clear();
      resetDateSelection();
      render();
    });

    el.notesArea.addEventListener("input", () => {
      el.notesStatus.textContent = "Сохраняю...";
      clearTimeout(el.notesArea._saveTimer);
      el.notesArea._saveTimer = setTimeout(saveNote, 300);
    });

    hydrateEmbeddedNotes();
    el.addFootnoteButton.addEventListener("click", () => setFootnoteAddMode(!state.addingFootnote));
    el.wrap.addEventListener("click", addFootnoteAt);
    el.exportNotesHtml.addEventListener("click", downloadHtmlWithNotes);
    let footnoteResizeFrame = null;
    function refreshFootnotesAfterResize() {
      if (state.view !== "detail") return;
      cancelAnimationFrame(footnoteResizeFrame);
      footnoteResizeFrame = requestAnimationFrame(renderFootnotes);
    }
    if (typeof ResizeObserver === "function") {
      new ResizeObserver(refreshFootnotesAfterResize).observe(el.wrap);
    } else {
      window.addEventListener("resize", refreshFootnotesAfterResize);
    }
    syncControls();
    render();
  </script>
</body>
</html>
